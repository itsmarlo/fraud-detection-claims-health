---
applications:
  - name: health-fraud-detection-agent
    memory: 256M
    disk_quota: 512M
    instances: 1
    random-route: true
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT}
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      APP_ENV: cloud-foundry
      CORS_ORIGINS: "*"
